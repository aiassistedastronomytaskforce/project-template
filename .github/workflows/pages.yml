# Publishes site/ to GitHub Pages. Turn Pages on once: Settings → Pages → Source: "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.is_template }}
    outputs:
      has_site: ${{ steps.site.outputs.has_site }}
    steps:
      - uses: actions/checkout@v7
      - id: site
        run: echo "has_site=$([ -f site/index.html ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: check
    if: needs.check.outputs.has_site == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
