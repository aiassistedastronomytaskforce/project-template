name: project-yaml
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Check project.yaml
        shell: python
        run: |
          import os, sys, yaml
          p = yaml.safe_load(open("project.yaml"))
          repo = os.environ["GITHUB_REPOSITORY"].split("/")[1]
          kinds = {"pipeline", "demo", "tool", "data", "paper"}
          stages = {"sandbox", "active", "featured", "archived"}
          errs = []
          if repo == "project-template":
              sys.exit(0)
          if p.get("name") != repo:
              errs.append(f"name should be '{repo}'")
          if p.get("kind") not in kinds:
              errs.append(f"kind must be one of {sorted(kinds)}")
          elif not repo.startswith(p["kind"] + "-"):
              errs.append(f"repo name should start with '{p['kind']}-'")
          if p.get("stage") not in stages:
              errs.append(f"stage must be one of {sorted(stages)}")
          if not p.get("owners"):
              errs.append("owners is required")
          if "Which parts were AI-generated" in str(p.get("ai_use", "")):
              errs.append("fill in ai_use")
          for e in errs:
              print(f"::error file=project.yaml::{e}")
          sys.exit(1 if errs else 0)
