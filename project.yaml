# Copy this into hub/projects/<repo-name>.yaml as well. Keep both in sync.
name: repo-name                  # must match the repo name, with its kind prefix
kind: demo                       # pipeline | demo | tool | data | paper
stage: sandbox                   # sandbox | active | featured | archived (see org GOVERNANCE.md)
owners: [your-github-handle]
summary: One sentence on what it does.
live_url: null                   # GitHub Pages URL for demos, if any
schemas:                         # shared formats from hub/schemas it reads or writes
  reads: []                      # e.g. [lightcurve, system]
  writes: []
related: []                      # other org repos this builds on, replaces or overlaps with
ai_use: >-
  Which parts were AI-generated (code, text, analysis) and which you checked yourself.
